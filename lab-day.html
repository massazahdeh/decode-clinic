<meta charset="utf-8">
<title>Lab Day One</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&family=Caveat:wght@600;700&display=swap">
<style>
/* Projector-first game: one story scene per screen, big type, photos from the course slides. */
:root{
 --bg:#F3F7FB;--grid:#E2EBF4;--surface:#FFFFFF;--soft:#EDF3FA;--line:#D5E0EC;--ink:#1C2B4A;--muted:#5C6B85;
 --blue:#2F6FDE;--ok:#16915F;--ok-soft:#E1F5EC;--bad:#D03A40;--bad-soft:#FCE7E8;--gold:#FFC93C;
 --f-d:"Fredoka","Arial Rounded MT Bold",system-ui,sans-serif;--f-b:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;--f-h:"Caveat","Comic Sans MS",cursive}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1626;--grid:#16223A;--surface:#152038;--soft:#1C2A47;--line:#2B3B5C;--ink:#E8EEF8;--muted:#9DABC6;--blue:#7FA8FF;--ok:#45D49B;--ok-soft:#133A2D;--bad:#FF7A7E;--bad-soft:#3D1C22;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1626;--grid:#16223A;--surface:#152038;--soft:#1C2A47;--line:#2B3B5C;--ink:#E8EEF8;--muted:#9DABC6;--blue:#7FA8FF;--ok:#45D49B;--ok-soft:#133A2D;--bad:#FF7A7E;--bad-soft:#3D1C22;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;padding:0 16px 40px;color:var(--ink);font-family:var(--f-b);font-size:17px;line-height:1.45;background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px}
button{font:inherit;color:inherit}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.bar{position:sticky;top:0;z-index:6;margin:0 -16px;background:var(--bg);border-bottom:1px solid var(--line)}
.tape{height:8px;background:repeating-linear-gradient(-45deg,#FFC93C 0 14px,#1C2B4A 14px 28px)}
.bar-in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:8px 16px;flex-wrap:wrap}
.brand{font-family:var(--f-d);font-weight:700;font-size:22px;flex:1;min-width:0;white-space:nowrap}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:40px;height:40px;display:grid;place-items:center;cursor:pointer}
.icon-btn svg{width:20px;height:20px}
.sb{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tm{display:flex;align-items:center;gap:8px;border-radius:14px;padding:5px 12px 5px 5px;background:var(--surface);border:2px solid var(--line);font-weight:800;transition:transform .25s,box-shadow .25s}
.tm i{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:#fff;font-style:normal;font-family:var(--f-d)}
.tm b{font-family:var(--f-d);font-size:20px}
.tm.on{transform:translateY(-2px) scale(1.05);box-shadow:0 0 0 4px var(--tc)}
.meter{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px;color:var(--muted)}
.meter .tr{width:120px;height:14px;border-radius:99px;background:var(--soft);overflow:hidden;border:1px solid var(--line)}
.meter .tr i{display:block;height:100%;border-radius:99px;transition:width .6s,background .6s}
main{max-width:1100px;margin:0 auto;padding-top:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:clamp(16px,3vw,32px)}
.btn{border:none;border-radius:14px;padding:13px 26px;font-weight:800;font-size:18px;cursor:pointer;background:var(--blue);color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.2);transition:transform .12s}
.btn:hover{transform:translateY(-2px)}
.btn.ghost{background:var(--soft);color:var(--blue);box-shadow:none}
.btn.big{font-size:22px;padding:16px 36px}
/* setup */
.hero{display:grid;gap:16px;justify-items:center;text-align:center}
.hero h1{margin:0;font-family:var(--f-d);font-size:clamp(52px,10vw,100px);line-height:1}
.hero h1 span{color:var(--blue)}
.hero p{margin:0;color:var(--muted);max-width:60ch}
.cast{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.box{width:100%;max-width:620px;text-align:start;border:2px dashed var(--line);border-radius:18px;padding:14px 16px}
.box h3{margin:0 0 6px;font-family:var(--f-d);font-size:20px}
.box textarea{width:100%;font:inherit;border:2px solid var(--line);border-radius:12px;padding:10px;background:var(--surface);color:var(--ink);resize:vertical}
.box small{color:var(--muted)}
.modes{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.modes button{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 18px;font-weight:800;cursor:pointer}
.modes button[aria-pressed="true"]{border-color:var(--blue);background:var(--soft);color:var(--blue)}
.tnames{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
@media (max-width:520px){.tnames{grid-template-columns:1fr}}
.tnames label{display:flex;gap:8px;align-items:center;border:2px solid var(--line);border-radius:12px;padding:5px 8px}
.tnames i{width:26px;height:26px;border-radius:8px;flex:none}
.tnames input{border:none;background:none;font:inherit;font-weight:800;color:var(--ink);min-width:0;flex:1}
/* avatars */
.av{--c:#2F6FDE;display:inline-grid;place-items:center;border-radius:50%;background:var(--c);color:#fff;font-family:var(--f-d);font-weight:700;flex:none;box-shadow:inset 0 -4px 0 rgba(0,0,0,.15)}
/* scene */
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.chap{display:flex;align-items:center;gap:10px;font-weight:800;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-size:14px}
.chap .clock{background:#1C2B4A;color:#FFC93C;font-family:var(--f-d);border-radius:8px;padding:2px 10px;font-size:16px;letter-spacing:0}
.dots{display:flex;gap:4px;flex-wrap:wrap}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots i.g{background:#16915F} .dots i.r{background:#D03A40} .dots i.on{background:var(--blue);transform:scale(1.3)}
.panel{display:grid;grid-template-columns:auto 1fr auto;gap:20px;align-items:center;background:#FFFDF6;color:#1C2B4A;border:3px solid #1C2B4A;border-radius:22px;padding:18px 22px;box-shadow:6px 6px 0 #1C2B4A;animation:panel .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes panel{from{transform:translateY(20px) rotate(-1deg);opacity:0}}
@media (max-width:760px){.panel{grid-template-columns:1fr;justify-items:center;text-align:center}}
.who{display:grid;justify-items:center;gap:6px}
.who .av{width:110px;height:110px;font-size:52px}
.who b{font-family:var(--f-d);font-size:24px}
.story{font-size:clamp(22px,2.6vw,32px);line-height:1.3;font-weight:700;position:relative}
.story .nm{color:#2F6FDE}
.story .say{display:block;margin-top:8px;font-family:var(--f-h);font-size:clamp(26px,3vw,38px);font-weight:700;color:#7A3E00}
.props{display:flex;gap:10px;align-items:center}
.props img{height:clamp(90px,12vw,150px);width:auto;max-width:170px;object-fit:contain;background:#fff;border-radius:14px;padding:6px;border:1px solid #E3EAF2;animation:pop .5s .2s both cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.4) rotate(-10deg);opacity:0}}
.ask{display:flex;align-items:center;gap:12px;margin:22px 0 12px;flex-wrap:wrap}
.ask .av{width:46px;height:46px;font-size:22px}
.ask p{margin:0;font-family:var(--f-d);font-weight:600;font-size:clamp(22px,2.6vw,30px);line-height:1.2}
.ask .tag{font-size:15px;font-weight:800;color:#fff;border-radius:99px;padding:3px 12px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.opts.pics{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:760px){.opts,.opts.pics{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.opts{grid-template-columns:1fr}}
.op{border:3px solid var(--line);background:var(--surface);border-radius:16px;padding:14px 16px;font-weight:800;font-size:clamp(17px,1.9vw,22px);text-align:start;cursor:pointer;display:flex;gap:12px;align-items:center;transition:transform .12s,border-color .15s}
.op .k{flex:none;width:32px;height:32px;border-radius:9px;background:var(--soft);display:grid;place-items:center;font-family:var(--f-d);color:var(--blue)}
.opts.pics .op{flex-direction:column;text-align:center;background:#fff;color:#1C2B4A}
.opts.pics .op img{width:100%;max-width:150px;aspect-ratio:1;object-fit:contain}
.op:hover:not(:disabled){transform:translateY(-3px);border-color:var(--blue)}
.op:disabled{cursor:default}
.op.right{border-color:#16915F;background:var(--ok-soft)} .opts.pics .op.right{background:#E9F8F1}
.op.wrong{border-color:#D03A40;background:var(--bad-soft);animation:sh .4s} .opts.pics .op.wrong{background:#FDEEEF}
.op.dim{opacity:.4}
@keyframes sh{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.out{margin-top:16px;border-radius:18px;padding:16px 20px;display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;animation:panel .45s cubic-bezier(.2,1.4,.4,1)}
.out.good{background:var(--ok-soft);border:2px solid #16915F} .out.bad{background:var(--bad-soft);border:2px solid #D03A40}
.out .big{font-family:var(--f-d);font-weight:700;font-size:clamp(28px,3.4vw,42px);line-height:1}
.out.good .big{color:var(--ok)} .out.bad .big{color:var(--bad)}
.out p{margin:0;font-size:clamp(18px,2vw,23px);font-weight:700}
.rule{display:inline-block;margin-top:8px;font-family:var(--f-h);font-weight:700;font-size:clamp(22px,2.6vw,32px);color:#7A3E00;background:#FFF3CF;border-radius:10px;padding:0 12px;transform:rotate(-1.5deg)}
.steal{margin-top:14px;text-align:center;font-family:var(--f-d);font-weight:700;font-size:clamp(24px,3vw,34px);color:#fff;border-radius:16px;padding:10px;animation:panel .4s}
.nextrow{display:flex;justify-content:flex-end;margin-top:14px}
.banner{position:fixed;left:50%;bottom:10%;z-index:38;transform:translateX(-50%);background:linear-gradient(90deg,#F25C05,#FFC93C);color:#fff;font-family:var(--f-d);font-weight:700;font-size:clamp(30px,5vw,56px);padding:8px 30px;border-radius:18px;box-shadow:0 8px 0 rgba(0,0,0,.18);pointer-events:none;animation:ban 1.6s forwards;white-space:nowrap}
@keyframes ban{0%{transform:translateX(-50%) scale(.3) rotate(-8deg);opacity:0}15%{transform:translateX(-50%) scale(1.1) rotate(3deg);opacity:1}25%{transform:translateX(-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translateX(-50%) translateY(-30px)}}
.plus{position:fixed;z-index:40;pointer-events:none;font-family:var(--f-d);font-weight:700;font-size:28px;color:#16915F;animation:plus 1.1s ease-out forwards}
@keyframes plus{to{transform:translateY(-60px);opacity:0}}
.chapter{display:grid;justify-items:center;gap:12px;text-align:center;padding:30px 0;animation:panel .5s}
.chapter .n{font-weight:800;color:#F25C05;letter-spacing:.2em}
.chapter h2{margin:0;font-family:var(--f-d);font-size:clamp(44px,8vw,84px);line-height:1}
.chapter p{margin:0;color:var(--muted);font-size:20px}
/* end */
.end h2{font-family:var(--f-d);font-size:clamp(34px,5vw,54px);margin:0 0 10px;text-align:center}
.podium{display:grid;gap:8px;max-width:560px;margin:0 auto 20px}
.podium div{display:flex;align-items:center;gap:12px;border-radius:14px;padding:10px 14px;background:var(--soft);font-weight:800;font-size:19px}
.podium div:first-child{background:#FFF3CF;color:#5A4300;font-size:23px;border:3px solid #FFC93C}
.podium .pt{margin-left:auto;font-family:var(--f-d)}
.recap{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:700px){.recap{grid-template-columns:1fr}}
.rc{display:flex;gap:12px;align-items:center;border:2px solid var(--line);border-radius:16px;padding:10px 12px;background:var(--surface);animation:panel .4s both}
.rc .av{width:44px;height:44px;font-size:20px}
.rc b{display:block;font-size:16px}
.rc span{font-family:var(--f-h);font-size:24px;font-weight:700;color:#B4501A;line-height:1.05}
.rc.r{border-color:#F3B4B6}
.flasky{width:80px;height:80px;flex:none}
.flasky svg{width:100%;height:100%;overflow:visible}
.bc{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:24px;align-items:center;animation:panel .45s cubic-bezier(.2,1.4,.4,1)}
@media (max-width:760px){.bc{grid-template-columns:1fr}}
.bcpic{position:relative;background:#fff;border:3px solid #1C2B4A;border-radius:22px;box-shadow:6px 6px 0 #1C2B4A;display:grid;place-items:center;padding:20px;min-height:280px}
.bcpic img{max-width:100%;max-height:300px;object-fit:contain;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.bcpic .hold{position:absolute;left:12px;bottom:-18px;display:flex;align-items:center;gap:8px;background:#FFFDF6;border:2px solid #1C2B4A;border-radius:99px;padding:3px 14px 3px 3px;color:#1C2B4A}
.bcpic .hold b{font-family:var(--f-d);font-size:18px}
.bcq{margin:0;font-size:clamp(20px,2.3vw,28px);font-weight:700}
.bcq .nm{color:#2F6FDE}
.tgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
@media (max-width:760px){.tgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tgrid div{background:#fff;color:#1C2B4A;border:2px solid #CDEBDC;border-radius:12px;padding:6px;display:grid;justify-items:center;gap:2px;text-align:center;font-size:12px;line-height:1.15}
.tgrid div.r{border-color:#F3B4B6}
.tgrid img{width:100%;max-width:70px;aspect-ratio:1;object-fit:contain}

.cast .mini,.rc .mini{width:54px;height:54px;display:inline-block}
.mini svg,.mini2 svg{width:100%;height:100%}
.mini2{width:48px;height:48px;display:inline-block;flex:none}
.casecover,.closed{display:grid;justify-items:center;gap:12px;text-align:center;padding:16px 0;animation:panel .5s cubic-bezier(.2,1.4,.4,1)}
.cno{font-weight:800;color:#F25C05;letter-spacing:.2em}
.bigface{width:170px;height:170px}
.bigface svg{width:100%;height:100%}
.casecover h2{margin:0;font-family:var(--f-d);font-size:clamp(40px,7vw,72px);line-height:1}
.casecover h2 .nm,.mis .nm,.say2 .nm{color:var(--blue)}
.mis{margin:0;font-size:clamp(20px,2.4vw,26px);font-weight:700;max-width:40ch}
.say2{margin:0;font-family:var(--f-h);font-weight:700;font-size:clamp(26px,3vw,36px);color:#B4501A}
.room{display:grid;grid-template-columns:minmax(260px,330px) 1fr;gap:24px;align-items:start}
@media (max-width:820px){.room{grid-template-columns:1fr}}
.side{display:grid;gap:12px;background:#FFFDF6;color:#1C2B4A;border:3px solid #1C2B4A;border-radius:22px;padding:16px;box-shadow:6px 6px 0 #1C2B4A}
.phead{display:flex;gap:12px;align-items:center}
.face{width:96px;height:96px;flex:none}
.face svg{width:100%;height:100%}
.bounce{animation:bnc .6s}.shake{animation:sh .45s}
@keyframes bnc{30%{transform:translateY(-12px)}60%{transform:none}}
.ptag{display:block;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#5C6B85}
.pname{display:block;font-family:var(--f-d);font-size:30px;line-height:1.05}
.hearts{display:flex;gap:4px;margin-top:4px}
.hearts svg{width:26px;height:26px;fill:#E3E8EF;transition:fill .3s}
.hearts svg.on{fill:#E5484D}
.bub2{position:relative;background:#fff;border:2px solid #1C2B4A;border-radius:16px;padding:10px 14px;font-family:var(--f-h);font-size:26px;font-weight:700;line-height:1.1}
.bub2.g{background:#E9F8F1} .bub2.r{background:#FDEEEF}
.bub2 .nm{color:#2F6FDE}
.scene{margin:0;background:#fff;border-radius:14px;border:1px solid #E3EAF2;display:grid;place-items:center;padding:8px;min-height:150px}
.scene img{max-width:100%;max-height:190px;object-fit:contain;animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
.notes{list-style:none;margin:0;padding:0;display:grid;gap:6px;max-height:220px;overflow:auto}
.notes li{display:flex;gap:8px;font-size:14px;font-weight:700;line-height:1.3;animation:panel .35s}
.notes li i{font-style:normal;flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:13px}
.notes li.y i{background:#16915F} .notes li.n i{background:#D03A40}
.nb{display:grid;gap:12px;min-width:0}
.rail{display:flex;gap:6px}
.pill{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;border:2px solid var(--line);color:var(--muted)}
.pill.now{border-color:var(--blue);color:var(--blue);transform:scale(1.15)} .pill.ok{background:#16915F;border-color:#16915F;color:#fff} .pill.bad{background:#D03A40;border-color:#D03A40;color:#fff}
.sit{background:var(--soft);border-radius:16px;padding:12px 16px;animation:panel .4s}
.stag{font-size:13px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.sit p{margin:4px 0 0;font-size:clamp(20px,2.3vw,27px);font-weight:700;line-height:1.3}
.sit .nm,.askrow .nm{color:var(--blue)}
.say3{font-family:var(--f-h);font-size:clamp(24px,2.8vw,34px)!important;color:#B4501A}
.askrow{display:flex;align-items:center;gap:10px}
.askrow p{margin:0;font-family:var(--f-d);font-weight:600;font-size:clamp(21px,2.4vw,28px);line-height:1.2}
.askrow .tag{font-size:14px;font-weight:800;color:#fff;border-radius:99px;padding:3px 10px;font-family:var(--f-b)}
.opts.pics .op{position:relative}
.nm2{min-height:1.3em}
.opts.multi .op[aria-pressed="true"]{border-color:var(--blue);background:#EAF2FF;transform:translateY(-3px)}
.op .tick{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:50%;border:2px solid #C9D4E2;background:#fff}
.op[aria-pressed="true"] .tick{background:#2F6FDE;border-color:#2F6FDE;box-shadow:inset 0 0 0 4px #fff}
.opts.multi .op.right{border-color:#16915F;background:#E9F8F1;transform:none}.opts.multi .op.wrong{border-color:#D03A40;background:#FDEEEF}
.op.missed{border-style:dashed;border-color:#16915F}
.pickcount{margin-right:auto;font-weight:800;color:var(--muted);align-self:center}
.why2{margin-right:auto;font-size:18px;align-self:center;max-width:60ch}
.why2 b{color:var(--blue)}
.ordwrap{display:grid;gap:12px}
.slots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.slot{min-height:110px;border:3px dashed var(--line);border-radius:16px;display:grid;place-items:center;font-family:var(--f-d);font-size:30px;color:var(--muted);text-align:center;padding:6px}
.slot.f{border:3px solid #16915F;background:#fff;color:#1C2B4A;font-size:15px;font-weight:800;animation:pop .35s}
.slot.f img{max-height:70px;max-width:100%;object-fit:contain}
.slot.f b{font-size:40px;color:#D7262E;line-height:1}
.stamp3{font-family:var(--f-d);font-weight:700;font-size:clamp(34px,6vw,58px);color:#16915F;border:6px solid #16915F;border-radius:16px;padding:0 20px;transform:rotate(-6deg);animation:st3 .5s cubic-bezier(.2,1.6,.4,1)}
.stamp3.bad{color:#D03A40;border-color:#D03A40}
@keyframes st3{from{transform:rotate(-6deg) scale(2.4);opacity:0}}
.heartsbig{margin:0;font-size:40px;color:#E5484D;letter-spacing:6px}.heartsbig span{color:#D5DEE8}
.lessoncard{background:#FFF3CF;color:#5A4300;border-radius:18px;padding:14px 22px;text-align:start;transform:rotate(-1deg);box-shadow:4px 4px 0 #E5C060;max-width:560px;width:100%}
.lessoncard h3{margin:0 0 6px;font-family:var(--f-d);font-size:24px}
.lessoncard ul{margin:0;padding-left:22px;font-family:var(--f-h);font-size:28px;font-weight:700;line-height:1.15}
.rc span{display:block}
@media (max-width:600px){.meter>span:first-child{display:none}.meter .tr{width:70px}.brand{flex:none}}
.nextrow .btn{white-space:nowrap}
.wheelwrap{display:grid;justify-items:center;gap:14px;text-align:center}
.wt{margin:0;font-family:var(--f-d);font-size:clamp(28px,4.4vw,46px)}
.wheel{position:relative;width:min(420px,86vw);aspect-ratio:1}
.wsvg{width:100%;height:100%;filter:drop-shadow(0 8px 0 rgba(0,0,0,.15))}
.pointer{position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:18px solid transparent;border-right:18px solid transparent;border-top:34px solid #1C2B4A;filter:drop-shadow(0 3px 0 #FFC93C)}
#wg{transform-box:fill-box;transform-origin:center}
.stage{position:relative;aspect-ratio:4/3;border-radius:16px;overflow:hidden;border:2px solid #1C2B4A;background:#E8F1FA}
.stage .bg{position:absolute;inset:0;width:100%;height:100%}
.kid{position:absolute;left:3%;bottom:12%;width:38%;animation:breathe 3s ease-in-out infinite;transform-origin:bottom center}
.kid .khead{width:66%;margin:0 auto -16%;position:relative;z-index:2}
.benchfront{position:absolute;left:0;right:0;bottom:0;height:30%;background:linear-gradient(#4E5D6C 0 20%,#C3CFDA 20%);z-index:1}
.flaskamb,.prop,.fxl,.nametag{z-index:2}
.kid .khead svg,.kid .kbody svg{width:100%;height:auto;display:block}
.kid .kbody{width:100%}
.kid .sweat{position:absolute;top:2%;right:16%;font-size:20px;opacity:0;transition:opacity .3s}
.kid.worry .sweat{opacity:1;animation:drip 1s ease-in infinite}
@keyframes drip{to{transform:translateY(14px);opacity:0}}
@keyframes breathe{50%{transform:translateY(-3px) scaleY(1.01)}}
.kid.jump{animation:jump .7s cubic-bezier(.3,1.6,.5,1)}
@keyframes jump{30%{transform:translateY(-24%)}60%{transform:none}}
.kid.shake{animation:sh .5s}
.flaskamb{position:absolute;left:42%;bottom:29%;width:9%}
.flaskamb svg{width:100%;height:auto;display:block}
.flaskamb i{position:absolute;bottom:20%;left:45%;width:6px;height:6px;border-radius:50%;background:#fff;opacity:.9;animation:bub 1.8s infinite}
.flaskamb i:nth-child(3){left:30%;animation-delay:.6s}.flaskamb i:nth-child(4){left:60%;animation-delay:1.2s}
@keyframes bub{from{transform:translateY(0);opacity:.9}to{transform:translateY(-46px);opacity:0}}
.prop{position:absolute;right:3%;bottom:28%;width:42%;height:50%;display:grid;place-items:end center}
.prop img{max-width:100%;max-height:100%;object-fit:contain;background:#fff;border-radius:10px;padding:4px;box-shadow:0 4px 0 rgba(0,0,0,.12)}
.prop.in img{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.nametag{position:absolute;left:10px;top:10px;background:#1C2B4A;color:#FFC93C;font-family:var(--f-d);font-weight:700;border-radius:8px;padding:2px 10px;font-size:15px}
.fxl{position:absolute;inset:0;pointer-events:none}
.fxl.glow{animation:glowr 2.2s}
@keyframes glowr{0%,60%{background:rgba(255,90,0,.25)}100%{background:transparent}}
.fl{position:absolute;bottom:22%;width:30px;height:60px;margin-left:-15px;background:radial-gradient(ellipse at 50% 80%,#FFE066 0 30%,#FF9F43 45%,#E5484D 70%,transparent 72%);border-radius:50% 50% 40% 40%;animation:flame 2.2s ease-out forwards;transform-origin:bottom center}
@keyframes flame{0%{transform:scaleY(.2);opacity:0}15%{transform:scaleY(1.2);opacity:1}30%{transform:scaleY(.9) skewX(6deg)}45%{transform:scaleY(1.15) skewX(-6deg)}60%{transform:scaleY(1);opacity:1}100%{transform:scaleY(.3);opacity:0}}
.dr{position:absolute;left:68%;top:55%;width:12px;height:12px;border-radius:50% 50% 50% 0;background:#4FB3F2;animation:drop 1.1s ease-out forwards}
@keyframes drop{to{transform:translate(var(--x),var(--y)) rotate(45deg);opacity:0}}
.sm{position:absolute;bottom:40%;width:46px;height:46px;border-radius:50%;background:rgba(120,130,145,.55);animation:smoke 2.2s ease-out forwards}
@keyframes smoke{from{transform:scale(.3);opacity:0}30%{opacity:1}to{transform:translateY(-110px) scale(2.2);opacity:0}}
.sp{position:absolute;width:16px;height:16px;background:#FFC93C;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);animation:spk 1.4s ease-out forwards}
@keyframes spk{0%{transform:scale(0) rotate(0)}40%{transform:scale(1.4) rotate(90deg)}100%{transform:scale(0) rotate(180deg)}}
.phead{justify-content:space-between}
.ll{margin-left:auto;border:3px solid #8E5BD6;background:#F3EDFF;color:#5B2FB0;border-radius:12px;padding:6px 14px;font-family:var(--f-d);font-weight:700;font-size:18px;cursor:pointer;animation:pulse2 1.6s infinite}
@keyframes pulse2{50%{transform:scale(1.06)}}
.op.gone{opacity:.15;transform:scale(.95)}
.mystery{display:flex;flex-direction:column;align-items:center;gap:2px;border:3px dashed #8E5BD6;background:linear-gradient(135deg,#F3EDFF,#FFF3CF);color:#4A2A90;border-radius:16px;padding:8px 16px;cursor:pointer;animation:wob2 1.2s infinite;font-family:var(--f-d)}
.mystery b{font-size:18px}.mystery small{font-size:13px}
.mystery:disabled{animation:none;cursor:default;border-style:solid}
@keyframes wob2{25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
.mf{width:34px;height:40px;background:#8E5BD6;clip-path:polygon(38% 0,62% 0,62% 32%,100% 100%,0 100%,38% 32%)}
.mf.open{background:#FFC93C;animation:pop .5s}
.x2{color:#F25C05}
.sit.fbk{background:#F6EBD9;border:2px dashed #B4501A}
.fbt{color:#B4501A!important}
.fbrow{display:flex;gap:12px;align-items:center}.fbrow p{margin:0}
.pill.fbp{border-style:dashed}
.checklist{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.checklist span{aspect-ratio:1;border-radius:10px;border:2px solid #C9D4E2;display:grid;place-items:center;font-family:var(--f-d);font-weight:700;color:#5C6B85;font-size:18px}
.checklist span.y{background:#16915F;border-color:#16915F;color:#fff}.checklist span.n{background:#D03A40;border-color:#D03A40;color:#fff}.checklist span.now{border-color:#2F6FDE;color:#2F6FDE;transform:scale(1.1)}
.itool{display:grid;place-items:center;background:#fff;border-radius:14px;padding:10px;margin-top:6px}
.itool img{max-height:220px;max-width:100%;object-fit:contain;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.insp .side{background:#F2F4F7}
.lessoncard small{display:block;margin-top:6px;font-weight:800;color:#8A6A00}

.prog{height:10px;border-radius:99px;background:var(--soft);overflow:hidden}.prog i{display:block;height:100%;background:linear-gradient(90deg,#2F6FDE,#18A57A);border-radius:99px}
.pname.pop{animation:pop .45s cubic-bezier(.2,1.6,.4,1);color:#2F6FDE}
.phead .tag{font-size:13px;font-weight:800;color:#fff;border-radius:99px;padding:3px 10px;align-self:flex-start}
.hintb{margin-left:auto;border:2px solid #E0A100;background:#FFF7DD;color:#7A5600;border-radius:12px;padding:6px 14px;font-weight:800;cursor:pointer;white-space:nowrap}

.memo{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;background:linear-gradient(135deg,#FFF7DD,#FFFDF6);border:3px solid #E0A100;border-radius:20px;padding:14px 18px;color:#3D2E00;animation:panel .45s cubic-bezier(.2,1.4,.4,1);box-shadow:5px 5px 0 #E5C060}
.memo.r{border-color:#D03A40;box-shadow:5px 5px 0 #F3B4B6}

.say{border:2px solid #E0A100;background:#fff;color:#7A5600;border-radius:12px;padding:10px 16px;font-weight:800;cursor:pointer}

.fb{transform:rotateY(180deg);background:#FFFDF6;color:#1C2B4A;border:3px solid #16915F}

.fb b{font-family:var(--f-d);font-size:17px;line-height:1.1}.fb small{font-family:var(--f-h);font-size:19px;font-weight:700;color:#B4501A;line-height:1.05}
.rc span{display:block}

.mystq{width:70%;aspect-ratio:1;display:grid;place-items:center;background:#fff;border:3px dashed #9AB3C9;border-radius:14px;font-family:var(--f-d);font-weight:700;font-size:44px;color:#2F6FDE;animation:wig2 1.6s infinite}

let ac=null,soundOn=true;
const ctxA=()=>{ac=ac||new (window.AudioContext||window.webkitAudioContext)();return ac};
function tone(f,d,type='sine',t0=0,vol=.1,f2){if(!soundOn)return;try{const a=ctxA(),t=a.currentTime+t0,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.02)}catch(e){}}
function noise(d,t0=0,vol=.15,freq=800,q=1){if(!soundOn)return;try{const a=ctxA(),n=a.sampleRate*d,b=a.createBuffer(1,n,a.sampleRate),c=b.getChannelData(0);for(let i=0;i<n;i++)c[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=b;const f=a.createBiquadFilter();f.type='bandpass';f.frequency.value=freq;f.Q.value=q;const g=a.createGain();g.gain.value=vol;s.connect(f).connect(g).connect(a.destination);s.start(a.currentTime+t0)}catch(e){}}
const S={

  tick:()=>{noise(.025,0,.35,4200,1.5);tone(2200,.018,'square',0,.025)},
  clink:()=>{tone(1900,.12,'sine',0,.07);tone(2600,.16,'sine',.04,.05)},
  bubble:()=>{for(let i=0;i<5;i++)tone(300+Math.random()*500,.08,'sine',i*.06,.05,700+Math.random()*600)},

  stamp:()=>{tone(110,.14,'square',0,.07);noise(.12,0,.3,300,.8)},
  whoosh:()=>noise(.6,0,.35,900,.6),
  alarm:()=>{tone(880,.15,'square',0,.04);tone(660,.15,'square',.17,.04)},
  fanfare:()=>{[523,659,784,1046,1318].forEach((f,i)=>tone(f,.2,'sine',i*.1,.08))},

function tube({lo,hi,minor,lab,val,down=false,w=70,liquid='#6EC1F0',edge=.5}){const top=24,H=300,x0=80,x1=x0+w,n=Math.round((hi-lo)/minor);

 for(let i=0;i<=n;i++){const v=+(lo+i*minor).toFixed(2),yy=y(v),big=Math.abs(v/lab-Math.round(v/lab))<1e-6,mid=!big&&Math.abs((v*2)/lab-Math.round((v*2)/lab))<1e-6;
  t+=`<line x1="${x1}" y1="${yy}" x2="${x1-(big?28:mid?20:12)}" y2="${yy}" stroke="${INKC}" stroke-width="${big?2.6:1.6}"/>`;if(big)t+=`<text x="${x1+10}" y="${yy+6}" font-size="19" font-weight="800" font-family="Nunito,Arial,sans-serif" fill="${INKC}">${Number.isInteger(v)?v:v.toFixed(1)}</text>`}
 const yb=y(val),ye=yb-(down?-1:1)*0+(-edge*step);// edges higher than the bottom of the curve
 const liq=down?`<path d="M${x0} ${ye} Q${(x0+x1)/2} ${yb+edge*step} ${x1} ${ye} L${x1} ${top+H+30} L${x0} ${top+H+30}Z" fill="${liquid}" opacity=".85"/>`:`<path d="M${x0} ${ye} Q${(x0+x1)/2} ${yb+edge*step} ${x1} ${ye} L${x1} ${top+H+30} L${x0} ${top+H+30}Z" fill="${liquid}" opacity=".85"/>`;
 return `<svg viewBox="0 0 260 ${top+H+40}" role="img" aria-label="Scale to read"><rect x="${x0}" y="0" width="${w}" height="${top+H+40}" fill="#EEF6FC"/>${liq}<path d="M${x0} ${ye} Q${(x0+x1)/2} ${yb+edge*step} ${x1} ${ye}" stroke="#1F6FA8" stroke-width="3" fill="none"/>${t}<line x1="${x0}" y1="0" x2="${x0}" y2="${top+H+40}" stroke="${INKC}" stroke-width="3"/><line x1="${x1}" y1="0" x2="${x1}" y2="${top+H+40}" stroke="${INKC}" stroke-width="3"/><text x="18" y="${top+H/2}" font-size="17" font-weight="800" font-family="Nunito,Arial,sans-serif" fill="#5C6B85">mL</text></svg>`}

 {p:4,k:'order',fx:'fire',t:'{A} must heat a solid very strongly in a crucible. The bench is empty.',q:'{A}, build it from the bottom up. Tap in order.',o:[['bunsen','Bunsen burner'],['tripod','Tripod'],['claytri','Clay triangle'],['crucible','Crucible & cover']],trick:'From the floor up: burner, tripod, triangle, crucible.',show:'claytri',rec:'{A} built the crucible setup'},
 {p:4,k:'mcq',fx:'fire',pic:'valves',need:1,t:'Before lighting the burner, {A} checks the gas valve.',q:'{A}, which valve is OPEN?',o:[['Left: the handle is across the pipe'],['Right: the handle is along the pipe',1],['Both: the yellow colour means open']],trick:'Handle along the pipe = gas flows along the pipe.',show:'valves',rec:'{A} checked the gas valve'},
 {p:4,k:'pic',fx:'fire',t:'{A}\'s crucible is glowing hot and must move to the bench.',q:'{A}, what do you lift it with?',o:[['tongs',1],['spatula'],['stand'],['gauze']],trick:'Hot stuff? Tongs. Fingers never.',show:'tongs',rec:'{A} moved a hot crucible'},
 {p:4,k:'multi',fx:'fire',t:'{A} must heat water in a beaker over a flame and watch its temperature.',q:'{A}, tap the 5 things you need.',o:[['bunsen','Bunsen burner',1],['tripod','Tripod',1],['gauze','Wire gauze',1],['beaker','Beaker',1],['thermometer','Thermometer',1],['claytri','Clay triangle',0],['crucible','Crucible',0],['filler','Pipette filler',0]],trick:'Burner, tripod, gauze, beaker, and a thermometer to watch it.',show:'gauze',rec:'{A} heated water'},
 {p:4,k:'mcq',fx:'fire',draw:()=>thermo(36),t:'{A} checks the thermometer in the warm water.',q:'{A}, what is the temperature?',o:[['36 °C',1],['35 °C'],['37 °C'],['34 °C']],trick:'Find the nearest number, then count the small lines: here each one is 1 °C.',show:'thermometer',rec:'{A} read 36 °C'},
 {p:4,k:'mcq',fx:'fire',pic:'hotglass',t:'{A} heated a beaker ten minutes ago. It looks cool now.',q:'{A}, what do you do?',o:[['Use tongs: hot glass looks just like cold glass',1],['Pick it up quickly: glass cools in a few minutes'],['Touch it with a wet finger first to test it'],['Pour cold water on it so it cools faster']],trick:'Hot glass is a liar: it looks cold.',show:'hotglass',rec:'{A} did not trust the "cool" beaker'},
 {p:5,k:'mcq',fx:'splash',pic:'acid',t:'{A} must dilute a strong acid with water.',q:'{A}, how do you mix them?',o:[['Add the acid slowly to the water',1],['Add the water slowly to the acid'],['Pour both into the beaker at once'],['Either way, as long as it is slow']],trick:'Do what you oughta, add acid to water!',show:'acid',rec:'{A} added acid to water'},
 {p:5,k:'mcq',fx:'splash',pic:'stock',t:'{A} poured out too much reagent.',q:'{A}, what do you do with the extra?',o:[['Dispose of it, never back into the stock bottle',1],['Pour it back into the stock bottle carefully'],['Keep it in a beaker for next week'],['Pour it down the sink with lots of water']],trick:'Extra reagent never goes back home to the stock bottle.',show:'stock',rec:'{A} did not refill the stock bottle'},
 {p:5,k:'mcq',fx:'splash',pic:'flush',t:'Oops! A chemical splashes on {A}\'s hand.',q:'{A}, what do you do first?',o:[['Rinse it at once with plenty of water',1],['Wipe it off with a paper towel first'],['Wait a minute to see if it stings'],['Cover it with the lab coat sleeve']],trick:'Splash? Flush! Lots of water, right away.',show:'flush',rec:'{A} flushed a splash'},
 {p:6,k:'mcq',fx:'fire',pic:'flamsign',t:'{A} opens acetone right next to the Bunsen flame… and the sleeve catches fire!',q:'{A}, what do you do NOW?',o:[['Stop, drop to the floor and roll',1],['Run to the sink to put it out'],['Wave my arm fast to blow it out'],['Take off the lab coat while running out']],trick:'Stop, drop and roll. Never run. And acetone stays far from flames!',show:'sdr',rec:'{A} stopped, dropped and rolled'},
 {p:6,k:'order',fx:'fire',pic:'extp',t:'A small fire starts in a bin. The alarm is pulled, and {A} grabs the extinguisher.',q:'{A}, tap the PASS steps in order.',o:[[null,'Pull the pin'],[null,'Aim at the base of the fire'],[null,'Squeeze the lever'],[null,'Sweep side to side']],trick:'P-A-S-S: Pull, Aim, Squeeze, Sweep.',show:'extp',rec:'{A} used the extinguisher'},
 {p:6,k:'mcq',fx:'smoke',pic:'handwash',t:'The lab is over. {A} takes off the goggles.',q:'{A}, what must you do before leaving?',o:[['Wash my hands with soap and water',1],['Rinse my goggles in the sink'],['Fold my lab coat into my bag'],['Nothing more, the lab is over']],trick:'Last step of every lab: wash your hands.',show:'handwash',rec:'{A} washed hands before leaving'}];
const IMGN={...NAMES,noeat:'No eating or drinking',sniff:'Waft, never sniff',noexp:'Ask first',men1:'Eye level, bottom of the meniscus',valves:'Valve along the pipe = open',hotglass:'Hot glass looks cold',acid:'Acid into water',stock:'Never back to stock',flush:'Splash? Flush!',sdr:'Stop, drop, roll',extp:'PASS',handwash:'Wash your hands',tied:'Tie long hair'};

/* ================= STATE ================= */
const DEF=['Maha','Ahmad','Sara','Omar','Lina','Yousef','Rana','Khaled','Nour','Hala','Ali','Dana','Mira','Sami','Tala','Adam','Jana','Zaid','Leen','Karam','Yara','Fadi','Rama','Hamza','Salma'];
const TCOL=['#2F6FDE','#E5484D','#18A57A','#F59E3A'],TDEF=['Beakers','Flasks','Burners','Pipettes'];
let CLASS=[];try{CLASS=JSON.parse(localStorage.getItem('labday-class')||'[]')}catch(e){CLASS=[]}
function saveClass(t){CLASS=t.split(/[\n,،]+/).map(x=>x.trim()).filter(Boolean).slice(0,60);try{localStorage.setItem('labday-class',JSON.stringify(CLASS))}catch(e){}}
let teams=[],turn=0,qi=0,meter=100,log=[],seen={},A='';
const multi=()=>teams.length>1;
const fill=s=>s.replace(/\{A\}/g,`<span class="nm">${esc(A)}</span>`);
const plain=(s,n)=>s.replace(/\{A\}/g,n);
function speak(t){try{const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=.92;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}

/* ================= TOP BAR ================= */
function drawSB(){const sb=$('#sb');if(!teams.length){sb.innerHTML='';$('#meter').hidden=true;return}
 sb.innerHTML=teams.map((t,i)=>`<div class="tm ${multi()&&i===turn?'on':''}" style="--tc:${TCOL[i]}55" id="tm${i}"><i style="background:${TCOL[i]}">${multi()?String.fromCharCode(65+i):'★'}</i><span>${multi()?esc(t.n):'Class'}</span><b>${t.score}</b></div>`).join('');
 $('#meter').hidden=false;const f=$('#mfill');f.style.width=meter+'%';f.style.background=meter>70?'#16915F':meter>40?'#F59E3A':'#D03A40';$('#mpct').textContent=meter+'%'}
function floatPts(n,i){const el=$('#tm'+i);if(!el)return;const r=el.getBoundingClientRect(),p=h('span','plus','+'+n);p.style.left=(r.left+r.width/2-18)+'px';p.style.top=(r.top+6)+'px';document.body.append(p);setTimeout(()=>p.remove(),1200)}
function banner(t){if(reduce)return;const b=h('div','banner',t);document.body.append(b);setTimeout(()=>b.remove(),1700)}

/* ================= SETUP ================= */
function setup(){teams=[];drawSB();let n=2;const names=TDEF.slice();
 const draw=()=>{$('#modes').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.m===n));
  $('#tn').innerHTML=n===1?'':[...Array(n)].map((_,i)=>`<label><i style="background:${TCOL[i]}"></i><b>Team</b><input data-i="${i}" maxlength="16" value="${esc(names[i])}"></label>`).join('');
  $('#tn').querySelectorAll('input').forEach(x=>x.oninput=()=>names[+x.dataset.i]=x.value);
  const c=CLASS.length;$('#cc').textContent=c;$('#cast').innerHTML=(c?CLASS:DEF).slice(0,10).map(x=>`<span class="mini">${face(x,'happy')}</span>`).join('');
  $('#how').innerHTML=(c?`<b>${c} students.</b> Every story stars one of them by name${c<25?`, and some get a second story`:''}. `:'<b>No names yet:</b> sample names will be used. ')+(n===1?'The whole class plays together.':`Students are shuffled into ${n} teams, and the teams take turns.`)+' 30 stories, about 20 minutes.'};
 app.innerHTML=`<section class="card hero">
  <div class="cast" id="cast"></div>
  <h1>Lab <span>Stories</span></h1>
  <p>Thirty little lab stories, starring your classmates. Every story stars one of YOU. Make the safe choice, learn the memory trick, and say it together!</p>
  <div class="box"><h3>Your students (<span id="cc">0</span>)</h3><textarea id="cl" rows="7" placeholder="Paste your class list here, one name per line">${esc(CLASS.join('\n'))}</textarea><small>Saved only on this computer. You can paste a column of names from Excel or Word.</small></div>
  <div class="box"><h3>How do you want to play?</h3><div class="modes" id="modes"><button data-m="1">Whole class</button><button data-m="2">2 teams</button><button data-m="3">3 teams</button><button data-m="4">4 teams</button></div><div class="tnames" id="tn"></div><p id="how" style="margin:10px 0 0;color:var(--muted);font-size:15px"></p></div>
  <button class="btn big" id="go">Start the stories →</button></section>`;
 $('#cl').oninput=e=>{saveClass(e.target.value);draw()};
 $('#modes').querySelectorAll('button').forEach(b=>b.onclick=()=>{S.click();n=+b.dataset.m;draw()});draw();
 $('#go').onclick=()=>{const all=shuffle(CLASS.length?CLASS:DEF);teams=[...Array(n)].map((_,i)=>({n:(names[i]||TDEF[i]).trim()||TDEF[i],score:0,streak:0,m:all.filter((_,j)=>j%n===i),mi:0}));
  turn=0;qi=0;meter=100;log=[];seen={};S.fanfare();confetti(70);drawSB();story()};
}

/* ================= ONE STORY ================= */
function nextStar(){const t=teams[turn];const nm=t.m[t.mi%t.m.length];t.mi++;return nm}
function story(){const st=Q[qi];A=nextStar();const T=teams[turn],owner=turn;let tries=0,usedHint=false,finished=false;
 app.innerHTML=`<section class="card room"><aside class="side">
   <div class="phead"><div><span class="ptag">Story ${qi+1} of ${Q.length} · ${PARTS[st.p]}</span><b class="pname" id="pname">…</b></div>${multi()?`<span class="tag" style="background:${TCOL[owner]}">Team ${esc(T.n)}</span>`:''}</div>
   ${sceneHTML(A)}
   <div class="bub2" id="bub">…</div></aside>
  <section class="nb"><div class="prog"><i style="width:${qi/Q.length*100}%"></i></div><div class="sit" id="sit"><p>${fill(st.t)}</p>${st.draw?`<div class="readpic">${st.draw()}</div>`:''}</div><div class="askrow" id="ask"><p>${fill(st.q)}</p><button class="hintb" id="hint">💡 Hint</button></div><div id="opts"></div><div id="out"></div></section></section>`;
 // slot-machine name roll
 const pn=$('#pname'),pool=(CLASS.length?CLASS:DEF);let k=0;$('#kid').style.visibility='hidden';
 const iv=setInterval(()=>{pn.textContent=pick(pool);tone(600+(k++%4)*80,.03,'square',0,.02)},70);
 setTimeout(()=>{clearInterval(iv);pn.textContent=A;pn.classList.add('pop');$('#kid').style.visibility='visible';$('#face').innerHTML=face(A,'idle');$('.nametag').textContent=A;[523,659,784].forEach((f,i)=>tone(f,.12,'triangle',i*.07,.06));
  $('#bub').innerHTML=pick(['"Oh no, it is my turn!"','"Help me, everyone!"','"I think I know this one…"','"Okay, I am ready!"','"Why does this always happen to me?"'])},reduce?40:900);
 setProp(st.need?st.pic:null);if(!st.need)$('#prop').innerHTML='<span class="mystq">?</span>';drawSB();
 const box=$('#opts');
 const bub=(t,m)=>{const b=$('#bub');b.innerHTML=t;b.className='bub2 '+(m==='happy'?'g':m==='oops'?'r':'')};
 function correct(){if(finished)return;finished=true;const pts=tries===0&&!usedHint?10:5,t=teams[owner];
  if(tries===0){t.streak++;if(t.streak===3)banner('ON FIRE! x3');if(t.streak===6)banner('UNSTOPPABLE! x6')}else t.streak=0;
  t.score+=pts;floatPts(pts,owner);S.clink();S.fanfare();confetti(tries===0?50:20);kidMood('happy');play('sparkle');bub(pick(['"Yes! I got it!"','"Phew! Thank you!"','"I will never forget this!"','"Easy!"']),'happy');
  memo(true)}
 function wrongOnce(btn){tries++;meter=Math.max(0,meter-3);drawSB();S.bad();kidMood('oops');play(st.fx||'smoke');if(btn){btn.classList.add('wrong');btn.disabled=true}
  if(tries===1){bub(pick(['"Uh-oh… let me try again!"','"Oops! One more try?"','"That did not go well…"']),'oops');$('#out').innerHTML=`<div class="again">Not quite! ${esc(A)}, try once more${multi()?` (or ask your team)`:` (the class can help)`}.</div>`}
  else{finished=true;teams[owner].streak=0;bub('"Oh no! Now I know for next time."','oops');memo(false)}}
 function memo(ok){$('#hint')?.remove();setProp(st.show);box.querySelectorAll('.op').forEach(b=>{b.disabled=true;if(b.dataset.ok==='1')b.classList.add('right');else if(!b.classList.contains('wrong'))b.classList.add('dim');const n=b.querySelector('.nm2');if(n&&b.dataset.v)n.textContent=NAMES[b.dataset.v]});
  if(st.k==='multi')box.querySelectorAll('.op').forEach(b=>{if(b.dataset.ok==='1'&&b.getAttribute('aria-pressed')!=='true')b.classList.add('missed')});
  const keys=st.k==='pic'?st.o.filter(o=>o[1]).map(o=>o[0]):st.k==='multi'?st.o.filter(o=>o[2]).map(o=>o[0]):st.k==='order'?st.o.map(o=>o[0]).filter(Boolean):[];
  keys.forEach(k=>{if(TOOLS.includes(k))seen[k]=seen[k]===false?false:ok});
  log.push({A,qi,ok,first:tries===0});
  $('#out').innerHTML=`<div class="memo ${ok?'':'r'}"><div class="mpic">${photo(st.show)}</div><div><span class="mlab">${ok?'Memory trick':'Remember it like this'}</span><p class="mtrick">${st.trick}</p><div class="mrow"><button class="say" id="say">🔊 Say it together</button><button class="btn big" id="nx">${qi<Q.length-1?'Next story →':'See our class story →'}</button></div></div></div>`;
  $('#say').onclick=()=>speak(st.trick.replace(/[^\w\s,.:!'-]/g,' '));
  if(multi())turn=(owner+1)%teams.length;drawSB();
  $('#nx').onclick=()=>{S.click();qi++;if(qi>=Q.length)end();else if(qi%5===0)flash();else story()};setTimeout(()=>$('#nx').focus({preventScroll:true}),60)}
 // hint: removes one wrong answer (answer then worth 5)
 $('#hint').onclick=()=>{usedHint=true;$('#hint').remove();S.whoosh();const w=shuffle([...box.querySelectorAll('.op:not(:disabled)')].filter(b=>b.dataset.ok!=='1'&&b.getAttribute('aria-pressed')!=='true'));if(w[0]){w[0].disabled=true;w[0].classList.add('gone')};bub('"Thanks for the hint!"','')};
 if(st.k==='mcq'){box.className='opts';box.innerHTML=shuffle(st.o).map((o,j)=>`<button class="op" data-ok="${o[1]?1:0}"><span class="k">${j+1}</span><span>${o[0]}</span></button>`).join('');
  box.querySelectorAll('.op').forEach(b=>b.onclick=()=>{if(b.disabled||finished)return;b.dataset.ok==='1'?correct():wrongOnce(b)})}
 if(st.k==='pic'){box.className='opts pics';box.innerHTML=shuffle(st.o).map(x=>`<button class="op" data-v="${x[0]}" data-ok="${x[1]?1:0}">${photo(x[0],'option')}<span class="nm2"></span></button>`).join('');
  box.querySelectorAll('.op').forEach(b=>b.onclick=()=>{if(b.disabled||finished)return;b.dataset.ok==='1'?correct():(b.querySelector('.nm2').textContent=NAMES[b.dataset.v],wrongOnce(b))})}
 if(st.k==='multi'){box.className='opts pics multi';box.innerHTML=shuffle(st.o).map(x=>`<button class="op" data-v="${x[0]}" data-ok="${x[2]?1:0}" aria-pressed="false">${photo(x[0],x[1])}<span>${x[1]}</span><i class="tick"></i></button>`).join('');
  const btns=[...box.children],need=st.o.filter(x=>x[2]).length;const row=h('div','nextrow');row.innerHTML=`<span class="pickcount" id="pc">0 of ${need} picked</span><button class="btn" id="chk">Check</button>`;box.after(row);
  btns.forEach(b=>b.onclick=()=>{if(b.disabled||finished)return;S.click();b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')!=='true');$('#pc').textContent=btns.filter(x=>x.getAttribute('aria-pressed')==='true').length+` of ${need} picked`});
  $('#chk').onclick=()=>{if(finished)return;const bad=btns.filter(x=>(x.getAttribute('aria-pressed')==='true')!==(x.dataset.ok==='1'));
   if(!bad.length){row.remove();correct();return}
   // show which picks are wrong, keep the right ones, let them fix it once
   btns.forEach(x=>{if(x.getAttribute('aria-pressed')==='true'&&x.dataset.ok!=='1'){x.setAttribute('aria-pressed','false');x.classList.add('wrong');x.disabled=true}});
   const missing=btns.filter(x=>x.dataset.ok==='1'&&x.getAttribute('aria-pressed')!=='true').length;
   wrongOnce(null);if(!finished){$('#out').innerHTML=`<div class="again">Almost! ${missing?`${missing} still missing. `:''}Fix it and check again.</div>`}else row.remove()}}
 if(st.k==='order'){box.className='ordwrap';let k=0,mist=0;
  box.innerHTML=`<div class="slots">${st.o.map((_,j)=>`<div class="slot">${j+1}</div>`).join('')}</div><div class="opts ${st.o[0][0]?'pics':''}" id="oc"></div>`;
  $('#hint').onclick=()=>{usedHint=true;$('#hint').remove();const right=[...$('#oc').children].find(b=>+b.dataset.j===k);if(right){right.classList.add('glowhint')}};
  shuffle(st.o.map((x,j)=>[...x,j])).forEach(([key,lab,j])=>{const b=h('button','op',key?photo(key,lab)+`<span>${lab}</span>`:`<span>${lab}</span>`);b.dataset.j=j;b.onclick=()=>{if(b.disabled||finished)return;
   if(j===k){S.clink();const sl=box.querySelectorAll('.slot')[k];sl.classList.add('f');sl.innerHTML=key?photo(key,lab)+`<span>${lab}</span>`:`<b>${lab.charAt(0)}</b><span>${lab}</span>`;b.disabled=true;b.style.visibility='hidden';k++;
    if(k===st.o.length){tries=mist?1:0;correct()}}
   else{mist++;S.bad();b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');kidMood('oops');bub('"Not that one yet!"','oops');if(mist===1)play(st.fx)}};$('#oc').append(b)})}
 document.onkeydown=e=>{const n=+e.key,ops=[...box.querySelectorAll('.opts>.op, #opts.opts>.op')];if(n>=1&&n<=ops.length)ops[n-1].click()};
 scrollTo({top:0,behavior:reduce?'auto':'smooth'})}

/* ================= FLASH RECALL (every 5 stories) ================= */
function flash(){const last=log.slice(-5);
 app.innerHTML=`<section class="card"><div class="flashwrap"><span class="cno">FLASH RECALL</span><h2 class="wt">Do you still remember?</h2><p class="mis" style="margin:0 auto">Tap a card. Say the answer out loud BEFORE it flips!</p>
  <div class="fgrid">${last.map((l,j)=>{const st=Q[l.qi];return `<button class="fc" data-j="${j}"><span class="fin"><span class="ff"><span class="mini">${face(l.A,'happy')}</span><b>${esc(l.A)}</b><small>${esc(plain(st.rec,'').replace(/^ /,'…').trim())}</small><span class="qmk">?</span></span><span class="fb">${photo(st.show)}<b>${IMGN[st.show]||''}</b><small>${st.trick}</small></span></span></button>`}).join('')}</div>
  <button class="btn big" id="fgo">Back to the stories →</button></div></section>`;
 S.fanfare();app.querySelectorAll('.fc').forEach(c=>c.onclick=()=>{if(c.classList.contains('up'))return;c.classList.add('up');S.clink()});
 $('#fgo').onclick=()=>{S.click();story()};scrollTo({top:0})}

/* ================= END ================= */
function end(){document.onkeydown=null;const sorted=teams.map((t,i)=>({...t,i})).sort((a,b)=>b.score-a.score),top=sorted[0].score,firsts=log.filter(l=>l.first).length;
 app.innerHTML=`<section class="card end"><div style="display:grid;justify-items:center;gap:6px;margin-bottom:14px"><div class="flasky" style="width:110px;height:110px">${flasky('happy')}</div><h2>Our lab is ${meter}% safe!</h2><p style="margin:0;font-weight:700;color:var(--muted);font-size:19px">${firsts} of ${Q.length} stories solved on the first try.</p></div>
  ${multi()?`<div class="podium">${sorted.map((t,r)=>`<div><span style="font-family:var(--f-d);font-size:24px;width:1.4em">${r+1}</span><i style="width:22px;height:22px;border-radius:7px;background:${TCOL[t.i]}"></i>Team ${esc(t.n)}${t.score===top?(sorted.filter(x=>x.score===top).length>1?' · Joint winner!':' · Winner!'):''}<span class="pt">${t.score}</span></div>`).join('')}</div>`:`<div class="podium"><div>Class score<span class="pt">${teams[0].score}</span></div></div>`}
  <h2 style="font-size:30px">Our class lab story</h2><p style="text-align:center;margin:-4px 0 12px;color:var(--muted)">Each of you is now the expert on your own rule!</p>
  <div class="recap">${log.map((l,j)=>{const st=Q[l.qi];return `<div class="rc ${l.ok?'':'r'}" style="animation-delay:${j*.04}s"><span class="mini">${face(l.A,l.ok?'happy':'oops')}</span><div><b>${esc(plain(st.rec,l.A))}</b><span>${st.trick}</span></div></div>`}).join('')}</div>
  <h2 style="font-size:30px;margin-top:24px">Our bench: all 28 tools</h2><p style="text-align:center;margin:-4px 0 12px;color:var(--muted)">Red border = we got it wrong today. Study these!</p>
  <div class="tgrid">${TOOLS.map(k=>`<div class="${seen[k]===false?'r':''}">${photo(k)}<b>${NAMES[k]}</b></div>`).join('')}</div>
  <div style="display:flex;gap:10px;justify-content:center;margin-top:20px;flex-wrap:wrap"><button class="btn ghost" id="again">Play again</button></div></section>`;
 S.fanfare();confetti(160);scrollTo({top:0});$('#again').onclick=()=>{S.click();setup()}}
setup();

</script>
